[project]
name = "disk2pi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "ffmpeg>=1.4",
    "numpy>=2.4.4",
    "pandas>=3.0.2",
    "pillow>=12.1.1",
    "pydub>=0.25.1",
    "pypdf2>=3.0.1",
    "pyside6>=6.11.0",
    "pytest>=9.0.3",
    "python-vlc>=3.0.21203",
]

[project.scripts]
disk2pi = "disk2pi.main:main"

[dependency-groups]
dev = ["pyinstaller>=6.20.0"]

[build-system]
requires = ["uv_build>=0.9.24,<0.10.0"]
build-backend = "uv_build"
